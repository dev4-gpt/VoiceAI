name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Typecheck orchestrator
        run: npx tsc --noEmit
        working-directory: apps/orchestrator

      - name: Test web
        run: npm test
        working-directory: apps/web

      - name: Test orchestrator
        run: npm test
        working-directory: apps/orchestrator

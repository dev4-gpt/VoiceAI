        <h1>GrowthVoice OS</h1>
        <p>GrowthVoice OS is a browser voice agent for B2B websites. A visitor clicks, speaks, and is answered in real time — no phone number, no download. While it talks, the agent calls tools that create the lead, record budget, authority, need and timeline, and capture a consultation request in a Postgres-backed CRM, so the lead exists before the call ends.</p>
        <p>Before it listens, it tells the visitor they are talking to an AI. In the 13 US all-party-consent states it asks permission before anything is transcribed, and it keeps an append-only record of that consent. It runs on the AssemblyAI Voice Agent API and embeds on any site with one script tag.</p>
        <p>Plans: Starter $149/month (500 voice minutes), Pro $449/month (1,500 minutes), Enterprise $1,497/month (5,000 minutes).</p>
        <p>The live console needs JavaScript. Source code: <a href="https://github.com/dev4-gpt/VoiceAI">github.com/dev4-gpt/VoiceAI</a>.</p>
